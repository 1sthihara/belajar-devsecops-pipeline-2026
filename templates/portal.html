
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(200px, 1fr)
            );
            gap: 20px;
        }

        .menu a {
            text-decoration: none;
            color: inherit;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px 20px;
            transition: 0.2s;
        }

        .menu a:hover {
            background: #334155;
            transform: translateY(-5px);
        }

        .menu h2 {
            font-size: 20px;
        }

        .menu p {
            color: #94a3b8;
            font-size: 14px;
        }

        footer {
            margin-top: 40px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="logo">🛡️</div>

        <h1>SENTINEL PORTAL</h1>

        <p class="subtitle">
            Security Monitoring & Application Portal
        </p>

        <nav class="menu">
            <a href="/dashboard">
                <h2>Dashboard</h2>
                <p>Access application dashboard</p>
            </a>

            <a href="/index">
                <h2>Index</h2>
                <p>Access main application page</p>
            </a>

            <a href="/register">
                <h2>Registration</h2>
                <p>Access registration page</p>
            </a>
        </nav>

        <footer>
            Sentinel Flask | DevSecOps CI/CD Pipeline
        </footer>
    </main>
</body>
</html>
